    <nav class="wrap nav" aria-label="Main">
      <a class="logo" href="index.html">Fit<span>Lisa</span></a>

      </ul>

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1>Contact</h1>
        <p>Questions about coaching, training or nutrition? Send me a note and I'll get back to you.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <!-- Formspree: replace YOUR_FORM_ID with the ID from formspree.io (e.g. xyzabcde) -->
        <form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <label>Name
            <input type="text" name="name" autocomplete="name" required>
          </label>
          <label>Email
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label>I'm interested in
            <select name="interest">
              <option>Coaching</option>
              <option>Training</option>
              <option>Nutrition</option>
              <option>Something else</option>
            </select>
          </label>
          <label>Message
            <textarea name="message" required></textarea>
          </label>
          <input type="hidden" name="_subject" value="New message from fitlisa.com">
          <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
          <button class="btn" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>&copy; <span id="year">2026</span> FitLisa FitLife &middot; Lisa Brown</div>

        <li><a href="https://www.facebook.com/LisaBrown85" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8V6.2c0-.8.2-1.2 1.4-1.2H17V2h-2.6C11.3 2 10 3.5 10 6v2H8v3h2v11h4V11h2.7l.3-3z"/></svg></a></li>
        <li><a href="https://www.instagram.com/fitlisa_fitlife/" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a></li>
